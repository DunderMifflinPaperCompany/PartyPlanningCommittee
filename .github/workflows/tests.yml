# Belsnickel demands that every push be judged: impish or admirable.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite
          coverage: xdebug

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run the PHPUnit suite
        run: vendor/bin/phpunit
        env:
          XDEBUG_MODE: coverage

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-php
          path: build/coverage/cobertura.xml

  upload-coverage-php:
    needs: phpunit
    if: ${{ !cancelled() && needs.phpunit.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-php
      - uses: actions/upload-code-coverage@v1
        with:
          file: cobertura.xml
          language: PHP
          label: code-coverage-agent

  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run the Vitest suite
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-js
          path: build/coverage-js/cobertura-coverage.xml

  upload-coverage-js:
    needs: vitest
    if: ${{ !cancelled() && needs.vitest.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-js
      - uses: actions/upload-code-coverage@v1
        with:
          file: cobertura-coverage.xml
          language: JavaScript
          label: code-coverage-agent
